[dashboard]
title = "Lab Mon · Proxmox"
description = "Topologia, adresacja i stan środowiska Proxmox."
theme = "light"                 # light | dark
default_view = "topology"       # topology | table
refresh_seconds = 30
timeout_seconds = 5
read_guest_networks = true
show_addresses = true

[history]
enabled = true
interval_seconds = 60
retention_days = 30

[discovery]
enabled = false
interval_seconds = 300
cidrs = []
ports = [22, 80, 443, 1883, 5000, 5678, 6052, 8006, 8080, 8123, 8443, 8883]

[[proxmox]]
id = "lab"
label = "Laboratorium"
url = "https://proxmox.example.invalid:8006"
token_id_env = "PVE_TOKEN_ID"
token_secret_env = "PVE_TOKEN_SECRET"
# ca_file = "proxmox-ca.pem"

# Dla niezależnej instalacji dodaj drugie [[proxmox]] z innym id
# i innymi nazwami zmiennych tokenu. Jeden klaster wystarczy dodać raz.

[[services]]
source = "lab"
vmid = 900
name = "Przykładowa aplikacja"
endpoint = "app.example.invalid:8080"
depends_on = ["Przykładowa baza"]
note = "Wpis opisowy. Zastąp własną konfiguracją lub usuń."
