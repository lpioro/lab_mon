name: Test and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-lab-mon
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test Python application
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
      - name: Build and smoke-test image
        run: |
          docker build -t lab-mon:ci .
          docker run -d --name lab-mon-test -p 127.0.0.1:18080:8080 lab-mon:ci --demo
          trap 'docker rm -f lab-mon-test' EXIT
          curl --fail --retry 10 --retry-connrefused --max-time 5 http://127.0.0.1:18080/api/snapshot |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["dashboard"]["demo"] and len(d["sources"][0]["nodes"]) == 2'
      - name: Publish image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag lab-mon:ci "$image:sha-$GITHUB_SHA"
          docker tag lab-mon:ci "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
